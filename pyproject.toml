[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vparca"
version = "0.1.0"
description = "Process-bigraph migration of the E. coli Parameter Calculator (ParCa) from vEcoli / vivarium-ecoli"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eran Agmon" }]
dependencies = [
    "process-bigraph",
    "bigraph-schema",
    "numpy",
    "scipy",
    "cvxpy",
    "biopython",
    "sympy",
    "dill",
    "pandas",
    "numba",
    "unum",
]

[project.optional-dependencies]
test = ["pytest"]
# For the comparison harness that imports a live vEcoli/vivarium-ecoli
# alongside vParCa and diffs sim_data after each stage.
compare = ["vivarium-core"]

[tool.setuptools.packages.find]
include = ["vparca*", "reconstruction*", "wholecell*", "ecoli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
